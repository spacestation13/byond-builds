name: Mirror BYOND To R2

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: byond-mirror-r2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read

    env:
      PYTHONUNBUFFERED: "1"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Sync BYOND builds to Cloudflare R2
        id: sync
        run: python scripts/sync_byond_to_r2.py

      - name: Dispatch BYOND Tracy offset extractor
        if: steps.sync.outputs.synced == 'true'
        env:
          TRACY_WORKFLOW_DISPATCH_TOKEN: ${{ secrets.TRACY_WORKFLOW_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TRACY_WORKFLOW_DISPATCH_TOKEN" ]; then
            echo "TRACY_WORKFLOW_DISPATCH_TOKEN is not set"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TRACY_WORKFLOW_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/spacestation13/byond-tracy-offset-extractor/actions/workflows/fetch_byond_builds.yml/dispatches" \
            -d "{\"ref\":\"main\"}"